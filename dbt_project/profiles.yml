# Профиль подключения dbt к Postgres.
# Параметры читаются из переменных окружения — один и тот же profiles.yml
# работает и локально, и в Airflow, и в CI (нужно лишь задать DB_HOST и пр.).
finflow:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'postgres') }}"
      port: "{{ env_var('DB_PORT', '5432') | int }}"
      user: "{{ env_var('DB_USER', 'finflow') }}"
      password: "{{ env_var('DB_PASSWORD', 'finflow123') }}"
      dbname: "{{ env_var('DB_NAME', 'finflow_db') }}"
      schema: analytics
      threads: 4
