name: 'finflow'
version: '1.0.0'

# Профиль подключения берётся из dbt_project/profiles.yml
profile: 'finflow'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Материализация по слоям Medallion:
#  - staging  → view  (лёгкий слой очистки, пересчитывается на лету)
#  - marts    → table (Gold-витрины, читаются аналитикой и Grafana)
models:
  finflow:
    staging:
      +materialized: view
    marts:
      +materialized: table
