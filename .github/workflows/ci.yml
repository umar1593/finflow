name: FinFlow CI

on:
  push:
    branches: [ main, "week-*" ]
  pull_request:
    branches: [ main ]

jobs:

  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linter
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 ingestion/ spark/ dags/ expectations/ tests/ \
            --max-line-length=100 \
            --exclude=__pycache__ \
            --count --statistics

  unit-tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest tests/ -v

  dbt:
    name: dbt build & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: finflow
          POSTGRES_PASSWORD: finflow123
          POSTGRES_DB: finflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: finflow
      DB_PASSWORD: finflow123
      DB_NAME: finflow_db

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install "dbt-core==1.8.8" "dbt-postgres==1.8.8"

      - name: Create schema
        run: |
          PGPASSWORD=finflow123 psql -h localhost -U finflow -d finflow_db \
            -f ingestion/schema.sql

      - name: Seed sample data
        run: |
          PGPASSWORD=finflow123 psql -h localhost -U finflow -d finflow_db \
            -f ingestion/seed_sample.sql

      - name: dbt deps
        working-directory: dbt_project
        run: dbt deps

      - name: dbt build (run + test)
        working-directory: dbt_project
        run: dbt build --profiles-dir .

  great-expectations:
    name: Data quality (Great Expectations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: finflow
          POSTGRES_PASSWORD: finflow123
          POSTGRES_DB: finflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: finflow
      DB_PASSWORD: finflow123
      DB_NAME: finflow_db

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Great Expectations
        run: pip install -r expectations/requirements.txt

      - name: Create schema
        run: |
          PGPASSWORD=finflow123 psql -h localhost -U finflow -d finflow_db \
            -f ingestion/schema.sql

      - name: Seed sample data
        run: |
          PGPASSWORD=finflow123 psql -h localhost -U finflow -d finflow_db \
            -f ingestion/seed_sample.sql

      - name: Run expectation suites
        run: python expectations/validate.py
